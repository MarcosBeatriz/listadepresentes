<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presentes</title>

  <style>
    /* =========================
       🔤 FONTES LOCAIS
       ========================= */
    @font-face {
      font-family: 'ElmsSans';
      src: url('./fontes/ElmsSans.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    /* =========================
       🎯 VARIÁVEIS RESPONSIVAS
       ========================= */
    :root {
      --cor-principal: #A2C0A4;
      --cor-fundo: #E2E3DE;
      --card-radius: 10px;
      --imagem-proporcao: 3 / 4;

      /* PADRÃO CELULAR (Mobile First) */
      --gap: 30px;
      --titulo-fonte: 35px;
      --numero-fonte: 22px;
      --produto-fonte: 25px;
      --botao-fonte: 24px;
      --botao-radius: 8px;
      --btn-height: 50px;
    }

    @media (min-width: 100px) {
      :root {
        /* PADRÃO COMPUTADOR (Substitui as de cima em telas grandes) */
        --gap: 12px;
        --titulo-fonte: 40px;
        --numero-fonte: 14px;
        --produto-fonte: 16px;
        --botao-fonte: 14px;
        --btn-height: 40px;
      }
    }

    /* =========================
       🌍 BASE
       ========================= */
    body {
      margin: 0;
      font-family: 'ElmsSans', sans-serif;
      background: var(--cor-fundo);
    }
    
    .banner img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    header {
      background: var(--cor-principal);
      color: #2B3F2C;
      text-align: center;
      padding: 20px;
    }

    header h2 {
      font-size: var(--titulo-fonte);
      font-weight: 700;
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 10px;
    }

    /* =========================
       📱 GRID RESPONSIVO
       ========================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gap);
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* =========================
       🧱 CARD
       ========================= */
    .card {
      background: #BDC5AD;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .imagem {
      width: 100%;
      aspect-ratio: var(--imagem-proporcao);
      object-fit: cover;
      background: #eee;
    }

    .conteudo {
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .numero {
      font-size: var(--numero-fonte);
      font-weight: 700;
      color: #BF2604;
    }

    .produto {
      font-size: var(--produto-fonte);
      font-weight: 600;
      margin: 6px 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    /* =========================
       🔘 BOTÕES DOS CARDS
       ========================= */
    .botoes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-ver,
    .btn-disponivel,
    .btn-reservado,
    .btn-indisponivel {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--btn-height);
      border-radius: var(--botao-radius);
      font-size: var(--botao-fonte);
      font-family: 'ElmsSans', sans-serif; /* Forçando a fonte local nos botões */
      box-sizing: border-box;
      text-decoration: none;
    }

    .btn-ver {
      background: #28a745;
      color: white;
      font-weight: 600;
    }

    .btn-disponivel {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--btn-height);
      background: #007bff;
      color: white;
      font-weight: 700;
      border-radius: var(--botao-radius);
      font-size: var(--botao-fonte);
      font-family: 'ElmsSans', sans-serif;
      box-sizing: border-box;
      cursor: pointer;
    }

    .btn-reservado {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--btn-height);
      background: #FFC72C;
      color: #2B3F2C;
      font-weight: 600;
      border-radius: var(--botao-radius);
      font-size: var(--botao-fonte);
      font-family: 'ElmsSans', sans-serif;
      box-sizing: border-box;
    }

    .btn-indisponivel {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--btn-height);
      background: #dc3545;
      color: white;
      font-weight: 600;
      border-radius: var(--botao-radius);
      font-size: var(--botao-fonte);
      font-family: 'ElmsSans', sans-serif;
      box-sizing: border-box;
    }

    /* ===================================================
       💻 TELA DE RESERVA RESPONSIVA
       =================================================== */
    .modal {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--cor-fundo); 
      z-index: 2000;
      overflow-y: auto; 
      box-sizing: border-box;
    }

    .modal-content {
      background: white;
      width: 100%;
      min-height: 100%;
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    @media (min-width: 900px) {
      .modal {
        padding: 60px 20px;
        background: rgba(226, 227, 222, 0.85); 
      }
      .modal-content {
        min-height: auto;
        max-width: 450px;
        margin: 0 auto;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      }
    }

    .modal-content h3 {
      font-size: 28px;
      margin-top: 10px;
      margin-bottom: 20px;
      color: #2B3F2C;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 18px; 
      font-family: 'ElmsSans', sans-serif;
      box-sizing: border-box;
    }

    .modal-botoes {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    .modal-botoes button {
      flex: 1;
      height: 55px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-family: 'ElmsSans', sans-serif;
      cursor: pointer;
    }

    .btn-confirmar { background: #28a745; color: white; font-weight: 600; }
    .btn-confirmar:disabled { background: #80c791; cursor: not-allowed; }
    .btn-cancelar { background: #dc3545; color: white; font-weight: 600; }

    /* =========================
       🔔 CAIXA DE MENSAGEM
       ========================= */
    .mensagem-box {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .mensagem-conteudo {
      background: white;
      padding: 25px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <div class="banner">
    <picture>
      <!-- Se a tela for de computador (mínimo de 900px), usa o desktop -->
      <source media="(min-width: 900px)" srcset="./imagens/bannerDesktop.png">
      <!-- Caso contrário (celular), cai no padrão abaixo -->
      <img src="./imagens/bannerMobile.png" alt="Banner Lista de Presentes">
    </picture>
  </div>

  <header>
    <h2>LISTA DE PRESENTES</h2>
  </header>

  <div class="container">
    <div class="grid" id="lista">
      <p style="text-align:center; grid-column: 1 / -1; font-size: 18px;">Carregando lista de presentes...</p>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 style="font-weight:700;">Reservar presente</h3>
      <p id="infoItem" style="font-size: 18px; color: #BF2604; font-weight: 600; margin: 0 0 20px 0; text-align: center;"></p>

      <input id="nome" placeholder="Seu nome">
      <input id="contato" placeholder="Seu WhatsApp">

      <div class="modal-botoes">
        <button class="btn-confirmar" id="btnConfirmar" onclick="confirmarReserva()">Confirmar</button>
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="mensagemBox" class="mensagem-box">
    <div id="mensagemTexto" class="mensagem-conteudo"></div>
  </div>

  <script>
    // =========================================================================
    // ⚠️ ATENÇÃO: COLE AQUI A URL GERADA NO NOVO DEPLOY DO SEU APPS SCRIPT
    // =========================================================================
    const API_URL = "SUA_URL_DO_WEB_APP_AQUI"; 

    let numeroSelecionado = null;
    let listaProdutosOriginal = [];

    async function carregarDados() {
      try {
        const resposta = await fetch(API_URL);
        const json = await resposta.json();
        
        if (json.status === "sucesso") {
          renderizar(json.dados);
        } else {
          mostrarMensagem("Erro: " + json.mensagem);
        }
      } catch (erro) {
        mostrarMensagem("Erro ao conectar com a planilha.");
        console.error(erro);
      }
    }

    function renderizar(dados) {
      listaProdutosOriginal = dados; 
      const container = document.getElementById("lista");
      container.innerHTML = "";

      dados.forEach(item => {
        let botaoReserva = "";

        if (item.status === "Disponível") {
          botaoReserva = `<button class="btn-disponivel" onclick="abrirModal(${item.numero})">Reservar</button>`;
        } else if (item.status === "Reservado") {
          botaoReserva = `<button class="btn-reservado" disabled>Reservado</button>`;
        } else {
          botaoReserva = `<button class="btn-indisponivel" disabled>Indisponível</button>`;
        }

        const botaoLink = item.link 
          ? `<a class="btn-ver" href="${item.link}" target="_blank">Ver produto</a>` 
          : "";

        // As imagens dos produtos continuam vindo dinamicamente da planilha
        const imagem = item.imagem 
          ? `<img class="imagem" src="${item.imagem}">` 
          : `<div class="imagem"></div>`;

        container.innerHTML += `
          <div class="card">
            ${imagem}
            <div class="conteudo">
              <div class="numero">Nº ${item.numero}</div>
              <div class="produto">${item.produto}</div>
              <div class="botoes">
                ${botaoLink}
                ${botaoReserva}
              </div>
            </div>
          </div>
        `;
      });
    }

    function abrirModal(numero) {
      numeroSelecionado = numero;
      
      const item = listaProdutosOriginal.find(i => i.numero == numero);
      if(item) {
        document.getElementById("infoItem").innerText = `Nº ${item.numero} - ${item.produto}`;
      }

      const viewport = document.getElementById("viewportMeta");
      if (viewport) {
        viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      }

      document.getElementById("modal").style.display = "block";
      window.scrollTo(0, 0); 
    }

    function fecharModal() {
      document.getElementById("modal").style.display = "none";
      
      document.getElementById("nome").value = "";
      document.getElementById("contato").value = "";

      const viewport = document.getElementById("viewportMeta");
      if (viewport) {
        viewport.setAttribute('content', 'width=device-width, initial-scale=1.0');
      }
    }

    function mostrarMensagem(texto) {
      document.getElementById("mensagemTexto").innerText = texto;
      document.getElementById("mensagemBox").style.display = "flex";

      setTimeout(() => {
        document.getElementById("mensagemBox").style.display = "none";
      }, 2500);
    }

    async function confirmarReserva() {
      const nome = document.getElementById("nome").value.trim();
      const contato = document.getElementById("contato").value.trim();
      const btn = document.getElementById("btnConfirmar");

      if (!nome || !contato) {
        mostrarMensagem("Preencha nome e contato!");
        return;
      }

      btn.innerText = "Salvando...";
      btn.disabled = true;

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            numero: numeroSelecionado,
            nome: nome,
            contato: contato
          })
        });
        
        const json = await resposta.json();
        
        mostrarMensagem(json.mensagem);
        
        if(json.status === "sucesso") {
          fecharModal();
          carregarDados(); 
        }
      } catch (erro) {
        mostrarMensagem("Erro ao salvar reserva.");
        console.error(erro);
      } finally {
        btn.innerText = "Confirmar";
        btn.disabled = false;
      }
    }

    carregarDados();
  </script>

</body>
</html>
